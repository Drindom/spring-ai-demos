spring:
  application:
    name: spring-ai-vector-redis

  ai:
    model:
      chat: none
      embedding: openai

    openai:
      embedding:
        base-url: http://localhost:8880/v1
        api-key: ""
        model: qwen3-embedding-0.6b

    vectorstore:
      redis:
        initialize-schema: true
        index-name: spring-ai-index
        prefix: "spring-ai:document:"

  data:
    redis:
      host: localhost
      port: 6379